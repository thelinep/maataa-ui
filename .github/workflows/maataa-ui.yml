name: maataa-ui

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "fused-organism/**"
      - "docs/**"
      - "**/*.md"
  push:
    branches: [master, main]
    paths-ignore:
      - "fused-organism/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: maataa-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0 # react-router 8 requires >= 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Unit + e2e tests
        run: npx vitest run

      - name: Production build
        run: npm run build
