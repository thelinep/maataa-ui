name: fused-organism

# Runs the complete fused-organism certification on relevant changes.
# Certification evidence is retained as a workflow artifact tied to the
# tested commit; generated certification files are restored before the
# cleanliness check and are not committed by CI.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fused-organism.yml"
      - "fused-organism/**"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/fused-organism.yml"
      - "fused-organism/**"

concurrency:
  group: fused-organism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full certification, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fused-organism
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      # The runner context is not available in job-level env, so set the
      # report path from $RUNNER_TEMP once the job is running.
      - name: Set report paths
        run: echo "MAATAA_AXE_REPORT=$RUNNER_TEMP/maataa-story-a11y.json" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          # fused-organism requires Node >= 22.16 < 23 with npm 10.9.x
          # (enforced by gate:toolchain); same Node as the maataa-ui job.
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: fused-organism/package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      # Build before certification: its drift gate imports each package's dist/.
      - name: Build packages
        run: |
          npm run build
          npm run build:ui

      # Preserve the old nested security workflow's source-hygiene checks here.
      - name: Security hygiene
        run: npm run test:security

      - name: Admin tests
        run: npm run test:admin

      - name: Install pinned Chromium for browser certification
        id: chromium
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: "144.0.7559.96"
          install-dependencies: true

      - name: Set certified browser executable
        run: echo "MAATAA_BROWSER=${{ steps.chromium.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Full certification
        run: npm run certify

      - name: Preserve certification evidence and restore generated files
        if: always()
        run: |
          evidence="$RUNNER_TEMP/maataa-certification"
          mkdir -p "$evidence"
          if [ -f certification/certification.json ]; then cp certification/certification.json "$evidence/"; fi
          if [ -f certification/REPORT.md ]; then cp certification/REPORT.md "$evidence/"; fi
          if [ -f "$MAATAA_AXE_REPORT" ]; then cp "$MAATAA_AXE_REPORT" "$evidence/"; fi
          if [ -d packages/maataa-ui/storybook-static ]; then cp -R packages/maataa-ui/storybook-static "$evidence/storybook-static"; fi
          printf '%s\n' "$GITHUB_SHA" > "$evidence/tested-commit.txt"
          git restore -- certification/certification.json certification/REPORT.md

      - name: Upload commit-bound certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fused-certification-${{ github.sha }}
          path: ${{ runner.temp }}/maataa-certification
          if-no-files-found: error
          retention-days: 90

      - name: Generated files still clean after build and tests
        run: git diff --exit-code -- .
