name: MAATAA Chat desktop app

# Builds the local chat desktop app (Rust + Tauri) for macOS, Windows and
# Linux and keeps the installers as workflow artifacts. Runs by hand or when
# a chat-v* tag is pushed. The builds are not code-signed yet: macOS asks
# you to confirm the first launch, and Windows SmartScreen may warn.

on:
  workflow_dispatch:
  push:
    tags: ["chat-v*"]

concurrency:
  group: local-chat-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fused-organism
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: fused-organism/package-lock.json

      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fused-organism/examples/local-chat/src-tauri

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "^2.12" --locked

      - name: Build the app and its installers
        working-directory: fused-organism/examples/local-chat/src-tauri
        run: cargo tauri build

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: maataa-chat-${{ runner.os }}-${{ github.sha }}
          path: |
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/dmg/*.dmg
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/macos/*.app
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/msi/*.msi
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/nsis/*.exe
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/deb/*.deb
            fused-organism/examples/local-chat/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
