name: Security Hygiene
on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npm run test:security
      - run: npm run lint
