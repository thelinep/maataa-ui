<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAATAA UI Browser Certification</title><link rel="stylesheet" href="./styles.css"></head>
<body><main>
<header><div><strong>MAATAA UI · M2 Browser Certification</strong><div id="react-contract" class="maturity"></div></div><span class="status verified">SIMULATED / TEST FIXTURE</span></header>
<div class="layout" id="layout">
<section class="panel" aria-labelledby="adapter-heading"><h1 id="adapter-heading">React adapter contract</h1><div id="adapter-mount" class="row"></div><div role="tablist" aria-label="Control views"><button id="tab-overview" role="tab" aria-selected="true" tabindex="0">Overview</button><button id="tab-evidence" role="tab" aria-selected="false" tabindex="-1">Evidence</button></div><button id="dialog-open">Open approval dialog</button><button id="announce-btn">Announce command state</button><div id="live-region" aria-live="polite" role="status">No command update.</div></section>
<aside class="panel"><h2>Semantic state</h2><p class="status proposal">Approval required</p><p class="status verified">Observed state verified</p><div class="motion-probe" aria-label="Motion preference probe"></div><div class="forced-probe" aria-label="Forced colors probe"></div></aside>
</div>
<dialog id="approval-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Approve simulated command</h2><p>This is a browser certification fixture. No hardware is connected.</p><button id="dialog-close">Close approval dialog</button></dialog>
<section class="panel" style="margin-top:16px"><h2>Visual regression fixture</h2><div id="visual-fixture" class="visual-fixture" aria-label="Semantic color fixture"><span class="v1" aria-label="state.info"></span><span class="v2" aria-label="state.ai"></span><span class="v3" aria-label="state.proposal"></span><span class="v4" aria-label="state.approval"></span><span class="v5" aria-label="state.authorized"></span><span class="v6" aria-label="state.executing"></span><span class="v7" aria-label="state.verified"></span><span class="v8" aria-label="state.danger"></span><span class="v9" aria-label="state.stale"></span><span class="v10" aria-label="state.offline"></span></div></section>
</main><script type="module" src="./app.mjs"></script></body></html>
