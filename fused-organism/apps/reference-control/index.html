<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAATAA V3 Camera Certification Reference</title><style>body{font:16px system-ui;background:#07101c;color:#f4f7fb;margin:0;padding:30px}main{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #263851;background:#0c1727;border-radius:16px;padding:18px}button{background:#3567ff;color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:700}pre{white-space:pre-wrap;color:#9fd9ff}.state{color:#55d6a0}label{display:block;margin:10px 0}input{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><a href="#main">Skip to content</a><main id="main"><h1>MAATAA V3 — Governed Camera Control Reference</h1><p>Simulator only. No hardware is connected.</p><div class="grid"><section class="card"><h2>Camera</h2><p id="cameraState">Pan 0° · Tilt 0° · Zoom 1×</p><label>Pan <input id="pan" type="range" min="-90" max="90" value="15"></label><label>Tilt <input id="tilt" type="range" min="-45" max="45" value="-5"></label><button id="propose">Propose PTZ command</button></section><section class="card"><h2>Governed lifecycle</h2><div id="status" role="status" aria-live="polite">No command proposed.</div><button id="approve" disabled>Approve & execute simulation</button><pre id="receipt"></pre></section></div></main><script type="module" src="./app.mjs"></script></body></html>
